<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#050507">

  <title>Sofia</title>

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="apple-touch-icon"
    href="./icons/apple-touch-icon.png"
  >

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <!-- ===================================================
       LOGIN
       =================================================== -->

  <div
    id="loginOverlay"
    style="
      position:fixed;
      inset:0;
      z-index:99999;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(
          circle at 50% 30%,
          #17171d,
          #050507 65%
        );
      color:white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;
    "
  >

    <form
      id="loginForm"
      style="
        width:min(88vw,360px);
        padding:28px;
        border-radius:24px;
        background:rgba(255,255,255,.07);
        border:1px solid rgba(255,255,255,.12);
        backdrop-filter:blur(24px);
        -webkit-backdrop-filter:blur(24px);
        box-shadow:0 30px 80px rgba(0,0,0,.45);
      "
    >

      <div
        style="
          font-size:12px;
          letter-spacing:.18em;
          opacity:.55;
          margin-bottom:10px;
        "
      >
        PRIVATE ACCESS
      </div>

      <h1
        style="
          margin:0 0 8px;
          font-size:30px;
          font-weight:650;
        "
      >
        Sofia
      </h1>

      <p
        style="
          margin:0 0 22px;
          opacity:.65;
          line-height:1.5;
          font-size:14px;
        "
      >
        Passwort eingeben.
      </p>

      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        placeholder="Passwort"
        style="
          box-sizing:border-box;
          width:100%;
          padding:14px 16px;
          border-radius:14px;
          border:1px solid rgba(255,255,255,.14);
          background:rgba(0,0,0,.22);
          color:white;
          outline:none;
          font-size:16px;
        "
      >

      <button
        type="submit"
        style="
          width:100%;
          margin-top:12px;
          padding:14px 16px;
          border:0;
          border-radius:14px;
          background:white;
          color:#111;
          font-weight:700;
          font-size:15px;
        "
      >
        Öffnen
      </button>

      <div
        id="loginError"
        style="
          display:none;
          margin-top:14px;
          color:#ff9a9a;
          font-size:13px;
        "
      >
        Passwort falsch.
      </div>

    </form>

  </div>


  <!-- ===================================================
       APP
       =================================================== -->

  <div
    class="app"
    id="app"
    data-mood="flirty"
    data-speaking="false"
    data-live="false"
    style="display:none"
  >

    <!-- ===============================================
         AVATAR
         =============================================== -->

    <section class="avatarStage">

      <div id="sofiaAvatar">

        <!--
          WICHTIG:
          Masterdatei heißt exakt sofia-avatar.PNG
        -->

        <img
          class="avatar"
          src="./sofia-avatar.PNG"
          alt="Sofia"
        >

      </div>

      <div class="cinema"></div>

      <div class="breathGlow"></div>


      <!-- =============================================
           PRESENCE
           ============================================= -->

      <div class="presence">

        <i></i>

        <span id="presenceText">
          SOFIA · LIVE
        </span>

      </div>


      <!-- =============================================
           THOUGHT
           ============================================= -->

      <div
        class="thought"
        id="thought"
      >
        Na? Ich bin da. 😏
      </div>


      <!-- =============================================
           VOICE BARS
           ============================================= -->

      <div
        class="voiceBars"
        id="voiceBars"
        aria-hidden="true"
      >

        <b></b>
        <b></b>
        <b></b>
        <b></b>
        <b></b>
        <b></b>
        <b></b>

      </div>

    </section>


    <!-- =================================================
         RAIL
         ================================================= -->

    <aside class="rail">

      <button
        class="railBtn active"
        data-view="chat"
        title="Chat"
        type="button"
      >
        ◉
      </button>

      <button
        class="railBtn"
        data-view="memory"
        title="Memory"
        type="button"
      >
        ◌
      </button>

      <button
        class="railBtn"
        data-view="mood"
        title="Mood"
        type="button"
      >
        ◇
      </button>

    </aside>


    <!-- =================================================
         HEADER
         ================================================= -->

    <header class="topbar">

      <div class="identity">

        <div class="identityDot"></div>

        <div>

          <strong>
            Sofia
          </strong>

          <span id="statusText">
            online
          </span>

        </div>

      </div>


      <div
        class="clock"
        id="clock"
      >
        --:--
      </div>

    </header>


    <!-- =================================================
         MOOD PANEL
         ================================================= -->

    <section class="moodPanel">

      <button
        type="button"
        data-mood="entspannt"
      >
        Entspannt
      </button>

      <button
        type="button"
        data-mood="flirty"
        class="active"
      >
        Flirty
      </button>

      <button
        type="button"
        data-mood="amüsiert"
      >
        Amüsiert
      </button>

      <button
        type="button"
        data-mood="skeptisch"
      >
        Skeptisch
      </button>

      <button
        type="button"
        data-mood="genervt"
      >
        Genervt
      </button>

      <button
        type="button"
        data-mood="ernst"
      >
        Ernst
      </button>

    </section>


    <!-- =================================================
         CHAT
         ================================================= -->

    <section class="chatPanel">

      <div
        class="messages"
        id="messages"
      ></div>


      <form
        class="composer"
        id="chatForm"
      >

        <button
          class="micBtn"
          id="micBtn"
          type="button"
          aria-label="Mikrofon"
        >
          ●
        </button>


        <textarea
          id="messageInput"
          rows="1"
          maxlength="6000"
          placeholder="Schreib Sofia..."
          autocomplete="off"
        ></textarea>


        <button
          class="sendBtn"
          id="sendBtn"
          type="submit"
          aria-label="Senden"
        >
          ↑
        </button>

      </form>

    </section>


    <!-- =================================================
         ACTIONS
         ================================================= -->

    <div class="actions">

      <button
        id="cameraBtn"
        type="button"
        title="Kamera"
      >
        ◉
      </button>

      <button
        id="focusBtn"
        type="button"
        title="Focus"
      >
        ◇
      </button>

      <button
        id="muteBtn"
        type="button"
        title="Stumm"
      >
        ♫
      </button>

    </div>

  </div>


  <!-- ===================================================
       SCRIPTS
       Reihenfolge ist wichtig.
       =================================================== -->

  <script src="./app.js?v=39"></script>

  <script src="./sofia-avatar.js?v=431"></script>

  <script src="./live.js?v=432"></script>


  <!-- ===================================================
       LOGIN / SESSION
       =================================================== -->

  <script>
    (() => {
      "use strict";

      const overlay =
        document.getElementById(
          "loginOverlay"
        );

      const form =
        document.getElementById(
          "loginForm"
        );

      const input =
        document.getElementById(
          "loginPassword"
        );

      const error =
        document.getElementById(
          "loginError"
        );

      const app =
        document.getElementById(
          "app"
        );


      async function checkSession() {
        try {

          const response =
            await fetch(
              "/api/session",
              {
                method: "GET",
                credentials: "same-origin",
                cache: "no-store"
              }
            );


          if (!response.ok) {
            showLogin();
            return;
          }


          const data =
            await response.json();


          if (data?.authenticated) {
            showApp();
          }

          else {
            showLogin();
          }

        }

        catch (err) {

          console.error(
            "Session-Prüfung fehlgeschlagen:",
            err
          );

          showLogin();
        }
      }


      function showApp() {
        overlay.style.display =
          "none";

        app.style.display =
          "";
      }


      function showLogin() {
        overlay.style.display =
          "flex";

        app.style.display =
          "none";

        setTimeout(() => {
          input?.focus();
        }, 100);
      }


      form.addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();

          error.style.display =
            "none";


          const password =
            input.value;


          if (!password) {
            return;
          }


          const submitButton =
            form.querySelector(
              'button[type="submit"]'
            );


          submitButton.disabled =
            true;


          try {

            const response =
              await fetch(
                "/api/login",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  credentials:
                    "same-origin",

                  body:
                    JSON.stringify({
                      password
                    })
                }
              );


            if (!response.ok) {

              error.style.display =
                "block";

              return;
            }


            input.value = "";

            showApp();

          }

          catch (err) {

            console.error(
              "Login fehlgeschlagen:",
              err
            );

            error.textContent =
              "Verbindung fehlgeschlagen.";

            error.style.display =
              "block";

          }

          finally {

            submitButton.disabled =
              false;
          }
        }
      );


      checkSession();

    })();
  </script>


  <!-- ===================================================
       ALTE SERVICE WORKER ENTFERNEN
       =================================================== -->

  <script>
    (() => {
      "use strict";

      if (
        "serviceWorker"
        in navigator
      ) {

        window.addEventListener(
          "load",
          async () => {

            try {

              const registrations =
                await navigator
                  .serviceWorker
                  .getRegistrations();


              for (
                const registration
                of registrations
              ) {

                await registration
                  .unregister();

              }


              if (
                "caches"
                in window
              ) {

                const keys =
                  await caches.keys();


                for (
                  const key
                  of keys
                ) {

                  if (
                    key.startsWith(
                      "sofia-"
                    )
                  ) {

                    await caches.delete(
                      key
                    );

                  }

                }

              }

            }

            catch (err) {

              console.warn(
                "Service-Worker-Cleanup:",
                err
              );

            }

          }
        );

      }

    })();
  </script>

</body>
</html>
