<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Sofia Live"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#080a0d"><meta name="description" content="Sofia Live – interaktiver fotorealistischer Avatar-Prototyp"><title>Sofia Live</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"></head><body>
<div class="app" id="app" data-mood="flirty" data-speaking="false">
  <section class="avatarStage"><img class="avatar" src="./sofia-avatar.png" alt="Fotorealistischer Avatar von Sofia"><div class="cinema"></div><div class="breathGlow"></div><div class="presence"><i></i><span id="presenceText">SOFIA · LIVE</span></div><div class="thought" id="thought">Na? Ich bin da. 😏</div><div class="voiceBars" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b></div></section>
  <aside class="rail"><div class="logo">S</div><button class="railBtn active" data-view="chat">✦</button><button class="railBtn" data-view="memory">◷</button><button class="railBtn" data-view="settings">⚙</button></aside>
  <header><div><strong>Sofia</strong><span class="online">● online</span></div><div class="meta"><span>Hamburg</span><span id="clock"></span></div></header>

  <div class="actions"><button id="camera">◉<span>Kamera</span></button><button id="focus">⌁<span>Fokus</span></button><button id="mute">♬<span>Stumm</span></button></div>
</div><script src="./app.js"></script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
