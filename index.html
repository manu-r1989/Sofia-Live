<body>

  <!-- =====================================
       LOGIN
  ====================================== -->

  <div
    id="loginOverlay"
    style="
      position:fixed;
      inset:0;
      z-index:99999;
      background:
        radial-gradient(
          circle at 50% 30%,
          #191d24 0%,
          #080a0d 55%
        );
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      box-sizing:border-box;
      color:white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;
    "
  >

    <form
      id="loginForm"
      style="
        width:min(360px,100%);
        display:flex;
        flex-direction:column;
        gap:14px;
      "
    >

      <div
        style="
          font-size:34px;
          font-weight:700;
          letter-spacing:-1px;
        "
      >
        Sofia
      </div>

      <div
        id="loginStatus"
        style="
          opacity:.55;
          margin-bottom:10px;
        "
      >
        Sitzung wird geprüft …
      </div>

      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        placeholder="Passwort"
        required
        style="
          width:100%;
          box-sizing:border-box;
          font-size:16px;
          padding:15px;
          border-radius:14px;
          border:1px solid #30343b;
          outline:none;
          background:#12151a;
          color:white;
        "
      >

      <button
        id="loginButton"
        type="submit"
        style="
          width:100%;
          box-sizing:border-box;
          font-size:16px;
          font-weight:600;
          padding:15px;
          border:0;
          border-radius:14px;
          cursor:pointer;
        "
      >
        Entsperren
      </button>

      <div
        id="loginError"
        style="
          min-height:22px;
          font-size:14px;
          opacity:.7;
          text-align:center;
        "
      ></div>

    </form>

  </div>


  <!-- =====================================
       SOFIA
  ====================================== -->

  <div
    class="app tools-closed"
    id="app"
    data-mood="flirty"
    data-speaking="false"
    data-live="false"
  >

    <section class="avatarStage">

      <!--
        V4.3:
        Eindeutiger Avatar-Container.

        sofia-avatar.js übernimmt dieses
        Bild und animiert es.
      -->

      <div id="sofiaAvatar">

        <img
          class="avatar"
          src="./sofia-avatar.PNG?v=4192c1"
          alt="Sofia"
        >

      </div>


      <div class="cinema"></div>

      <div class="breathGlow"></div>





      <div
        class="thought"
        id="thought"
      >
        Na? Ich bin da. 😏
      </div>


      <div
        class="voiceBars"
        aria-hidden="true"
      >

        <b></b>
        <b></b>
        <b></b>
        <b></b>
        <b></b>

      </div>

    </section>


    <!-- =====================================
         NAVIGATION
    ====================================== -->
<!-- =====================================
         HEADER
    ====================================== -->

    <header>

      <div aria-hidden="true"></div>

      <div class="meta">

        <span>
          Hamburg
        </span>

        <span id="clock"></span>

      </div>

    </header>


    <!-- =====================================
         MOODS
    ====================================== -->

    <section class="moodPanel" id="moodPanel" aria-hidden="true">
      <small id="moodStatus" role="status" aria-live="polite"></small>

      <small>
        STIMMUNG
      </small>


      <div class="moods">
        <button id="moodAuto" type="button">Automatisch</button>

        <button
          data-mood="entspannt"
        >
          Entspannt
        </button>


        <button
          class="active"
          data-mood="flirty"
        >
          Flirty
        </button>


        <button
          data-mood="amüsiert"
        >
          Amüsiert
        </button>


        <button
          data-mood="skeptisch"
        >
          Skeptisch
        </button>


        <button
          data-mood="genervt"
        >
          Genervt
        </button>


        <button
          data-mood="ernst"
        >
          Ernst
        </button>

      </div>

    </section>


    <!-- =====================================
         CHAT
    ====================================== -->

    <section class="chatPanel">

      <div class="chatHead">

        <div>

          <strong id="sofiaLocation" role="status" aria-live="polite">…</strong>

          <small id="mode" role="status" aria-live="polite">
            bereit
          </small>

        </div>


        <div class="chatHeadActions">
          <button id="workspaceAction" type="button" aria-label="Chatwerkzeuge und Einstellungen" title="Chatwerkzeuge und Einstellungen">⋯</button>
          <button id="toolsToggle" type="button" aria-label="Werkzeugleiste ein-/ausblenden" aria-expanded="false" title="Werkzeuge">☷</button>
<button
            type="button"
            id="voiceToggle"
            class="icon liveMic"
            title="Live-Sprachchat starten"
            aria-label="Live-Sprachchat starten"
            aria-pressed="false"
          >
            🎙️<span class="liveDot" aria-hidden="true"></span>
          </button>

          <button
            type="button"
            id="chatMinimize"
            class="icon chatMinimize"
            title="Chat minimieren"
            aria-label="Chat minimieren"
            aria-expanded="true"
          >
            ▾
          </button>
        </div>

      </div>


      <div
        class="messages"
        id="messages"
      >

        <div class="msg sofia">

          Na? Endlich da. 😏

          <br>

          Was hast du heute vor?

        </div>

      </div>


      <p id="connectionStatus" class="connection-status" role="status" aria-live="polite" hidden></p>
      <button type="button" id="chatLatest" class="chat-latest" hidden aria-label="Zu den neuesten Nachrichten springen">↓ Neue Nachrichten</button>

      <form id="form">

        <textarea
          id="input"
          rows="1"
          aria-label="Nachricht an Sofia"
          autocomplete="off"
          placeholder="Schreib Sofia etwas …"
        ></textarea>


        <button
          id="sendButton"
          class="send"
          type="submit"
          aria-label="Nachricht senden"
        >
          ➤
        </button>

      </form>

    </section>


    <button type="button" id="chatRestore" class="chatRestore" title="Chat einblenden" aria-label="Chat einblenden">▴</button>

    <!-- =====================================
         ACTIONS
    ====================================== -->

    <div class="actions" role="group" aria-label="Werkzeuge">

      <button id="camera">

        ◉

        <span>
          Kamera
        </span>

      </button>


      <button id="focus">

        ⌁

        <span>
          Fokus
        </span>

      </button>

      <button id="moodToggle" type="button" aria-expanded="false" aria-controls="moodPanel">

        ◌

        <span>
          Stimmung
        </span>

      </button>




      <button id="memoryAction" type="button">◷<span>Erinnerung</span></button>
      <button id="galleryAction" type="button">▧<span>Galerie</span></button>
      <button id="socialAction" type="button">✉<span>Nachrichten</span></button>
<button id="mute">

        ♬

        <span>
          Stumm
        </span>

      </button>

    </div>

  </div>


  <!-- =====================================
       SESSION + LOGIN
  ====================================== -->

  <script>

    const loginOverlay =
      document.querySelector(
        "#loginOverlay"
      );


    const loginForm =
      document.querySelector(
        "#loginForm"
      );


    const loginPassword =
      document.querySelector(
        "#loginPassword"
      );


    const loginError =
      document.querySelector(
        "#loginError"
      );


    const loginStatus =
      document.querySelector(
        "#loginStatus"
      );


    const loginButton =
      document.querySelector(
        "#loginButton"
      );


    async function checkSession() {

      try {

        const response =
          await fetch(
            "/api/session",
            {
              method:
                "GET",

              credentials:
                "same-origin",

              cache:
                "no-store"
            }
          );


        if (response.ok) {
          const session=await response.json();
          if(session.testMode && !document.getElementById('sofia-test-banner')) {
            window.SofiaTestMode=true;
            const banner=document.createElement('div');banner.id='sofia-test-banner';banner.setAttribute('role','status');
            banner.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;padding:8px 12px;background:#694510;color:white;font-size:12px;display:flex;gap:12px;align-items:center;justify-content:center';
            const label=document.createElement('span');label.textContent='TESTVERSION 4.74.7 · Nur Testdaten · '+(session.paidEnabled?'Begrenzte KI-Nutzung':'KI-Aufrufe deaktiviert');
            const reset=document.createElement('button');reset.type='button';reset.textContent='Testdaten zurücksetzen';reset.onclick=async()=>{
              if(!window.confirm('Alle Chats, Fotos, Aufgaben und Erinnerungen dieser Testversion zurücksetzen? Nutzungsgrenzen bleiben erhalten.'))return;
              reset.disabled=true;
              try{const response=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operation:'reset_test'}),credentials:'same-origin',cache:'no-store'});if(!response.ok){const data=await response.json();label.textContent=data.error||'Zurücksetzen nicht möglich.';return;}
                for(const key of ['sofia_memory','sofia-photo-reference','sofia_task_notices_v417','sofia_draft_v448','sofia_pins_v448','sofia_read_at_v448'])localStorage.removeItem(key);window.location.reload();
              }catch{label.textContent='Zurücksetzen nicht möglich. Bitte erneut versuchen.';}finally{reset.disabled=false;}
            };
            banner.append(label,reset);document.body.append(banner);
            const app=document.getElementById('app');if(app)app.style.paddingTop='44px';
          }

          loginOverlay.style.display =
            "none";

          return true;

        }


        loginStatus.textContent =
          "Privatbereich";


        loginPassword.focus();


        return false;


      } catch (error) {

        console.error(
          "Session check:",
          error
        );


        loginStatus.textContent =
          "Privatbereich";


        loginError.textContent =
          "Verbindung konnte nicht geprüft werden.";


        return false;

      }

    }


    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        loginButton.disabled =
          true;


        loginError.textContent =
          "";


        loginStatus.textContent =
          "Prüfe Passwort …";


        try {

          const response =
            await fetch(
              "/api/login",
              {
                method:
                  "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                credentials:
                  "same-origin",

                body:
                  JSON.stringify({
                    password:
                      loginPassword.value
                  })
              }
            );


          let data = {};


          try {

            data =
              await response.json();

          } catch {}


          if (!response.ok) {

            loginStatus.textContent =
              "Privatbereich";


            loginError.textContent =
              data.error ||
              "Login fehlgeschlagen.";


            loginPassword.select();


            return;

          }


          loginPassword.value =
            "";


          loginError.textContent =
            "";


          loginOverlay.style.display =
            "none";


        } catch (error) {

          console.error(
            "Sofia Login:",
            error
          );


          loginStatus.textContent =
            "Privatbereich";


          loginError.textContent =
            "Verbindungsfehler.";


        } finally {

          loginButton.disabled =
            false;

        }

      }
    );


    checkSession();

  </script>
