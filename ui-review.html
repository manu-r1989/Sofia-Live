<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Sofia · UI-Prüfung</title>
<style>body{margin:0;padding:20px;background:#20242c;color:#fff;font:16px system-ui}label{display:flex;align-items:center;gap:12px;margin-bottom:16px}select{padding:10px;font:inherit}iframe{display:block;width:390px;height:844px;border:1px solid #68707e;border-radius:16px;background:#080b10}p{color:#c4c9d2}</style>
<label>Bildschirmbreite <select aria-label="Bildschirmbreite"><option value="320">320 px</option><option value="390" selected>390 px</option><option value="430">430 px</option><option value="768">768 px</option></select></label>
<p>Responsive Browserprüfung · keine iPhone-Hardware-Simulation</p><iframe title="Sofia auf schmalem Bildschirm" src="/"></iframe>
<script>document.querySelector('select').addEventListener('change',e=>document.querySelector('iframe').style.width=e.target.value+'px');</script></html>
